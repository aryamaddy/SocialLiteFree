name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build WebsiteClean & OriginalAppBlocker Release APKs
        run: |
          ./gradlew assembleWebsiteCleanRelease assembleNativeBlockerRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/websiteClean/release/app-websiteClean-release.apk dist/SocialLite-WebsiteClean.apk
          cp app/build/outputs/apk/nativeBlocker/release/app-nativeBlocker-release.apk dist/SocialLite-OriginalAppBlocker.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocialLiteFree-apks
          path: dist/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: NoScroll Free v2.0.0 (Build ${{ github.run_number }})
          body: |
            ### 🚀 NoScroll Free v2.0.0 (Build ${{ github.run_number }})

            **Exact NoScroll Dark UI & Engine (100% Free, Zero Subscriptions, Zero Ads):**
            - **Exact NoScroll Identity & Dark Theme:** Authentic NoScroll launcher icon, Dark / Light / System themes, and 4-tab layout (`Dashboard` · `Blocker` · `Analytics` · `Settings`).
            - **Blocker Plans:** `Block All`, `Curious Mode` (watch + cooldown), `One Reel Mode`, and `Pause` with Mindful Wait & anti-doomscroll quotes.
            - **Unlimited App Blocker & Daily Quota:** Lock any app or enforce daily allowances + `1m / 5m / 10m` timed unlocks.
            - **Unlimited Website & Keyword Blocker + Multi-Browser Shorts Blocker.**
            - **PIN Lock (Custom / Live Time / Date / Device Lock) + Optional Uninstall Guard.**
            - **Floating Scroll Watchtime Counter & Haptics + 14+ Social App Detectors.**

            **APKs included:**
            1. **`SocialLite-OriginalAppBlocker.apk`** — Full Native App & OS-level Reels/Shorts/App Blocker Edition.
            2. **`SocialLite-WebsiteClean.apk`** — Website / Chrome Direct Install Edition.
          files: |
            dist/SocialLite-WebsiteClean.apk
            dist/SocialLite-OriginalAppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
