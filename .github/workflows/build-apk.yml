name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build WebsiteClean & OriginalAppBlocker Release APKs
        run: |
          ./gradlew assembleWebsiteCleanRelease assembleNativeBlockerRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/websiteClean/release/app-websiteClean-release.apk dist/SocialLite-WebsiteClean.apk
          cp app/build/outputs/apk/nativeBlocker/release/app-nativeBlocker-release.apk dist/SocialLite-OriginalAppBlocker.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocialLiteFree-apks
          path: dist/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SocialLiteFree v1.6.0 (Build ${{ github.run_number }})
          body: |
            ### 🚀 SocialLiteFree v1.6.0 (Build ${{ github.run_number }}) — Full NoScroll Parity Edition (100% Free)

            **What's New in v1.6.0:**
            - **Blocker Plans (`Block All`, `Curious Mode`, `One Reel Mode`, `Pause`):** Timed watch + cooldown mode, single-reel DM/scroll exit mode, and Mindful Wait countdown with anti-doomscroll quotes.
            - **App Blocker & Daily Limits:** Lock any installed app or enforce daily screen-time allowances with temporary timed unlocks.
            - **Unlimited Website & Keyword Blocker:** Block custom domains, path prefixes, exact URLs, and keywords across 30+ Android browsers (Chrome, Brave, Firefox, Edge, Opera, Samsung) & in-app browser — 100% unlimited & free.
            - **PIN Lock & Uninstall Guard:** Custom PIN, Live Time PIN (12h/24h), Today's Date PIN, Device Screen Lock / Fingerprint, and optional Device Admin Uninstall Guard.
            - **Floating Watchtime Counter & Multi-Platform Native Shield:** Live pill overlay, haptic feedback, Blocking Action selector (`Smart Back`, `Minimize App`, `Lock Screen`), plus Instagram Stories, TikTok, X, Reddit, LinkedIn, Snapchat Discover/Stories & WhatsApp Status support.
            - **Zero Subscriptions & Zero Ads:** Every feature unlocked free forever.

            **APKs included:**
            1. **`SocialLite-OriginalAppBlocker.apk`** — Full Native App & OS-level Reels/Shorts/App Blocker Edition.
            2. **`SocialLite-WebsiteClean.apk`** — Website / Chrome Direct Install Edition.
          files: |
            dist/SocialLite-WebsiteClean.apk
            dist/SocialLite-OriginalAppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
