name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build WebsiteClean & OriginalAppBlocker Release APKs
        run: |
          ./gradlew assembleWebsiteCleanRelease assembleNativeBlockerRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/websiteClean/release/app-websiteClean-release.apk dist/SocialLite-WebsiteClean.apk
          cp app/build/outputs/apk/nativeBlocker/release/app-nativeBlocker-release.apk dist/SocialLite-OriginalAppBlocker.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocialLiteFree-apks
          path: dist/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SocialLiteFree v1.5.1 (Build ${{ github.run_number }})
          body: |
            ### 🚀 SocialLiteFree v1.5.1 (Build ${{ github.run_number }})

            **Fixes in v1.5.1:**
            - **Fixed "Works 1st time, fails 2nd time" bug**: Enforced strict on-screen bounds checks so off-screen Instagram Home/DM pager views no longer falsely unlock Reels on subsequent taps.
            - **24/7 Blocker Keep-Alive**: Added `BlockerKeepAliveService` so OEMs don't stop blocking when SocialLite is closed from Recents.
            - **Enhanced DM Sent-Reel Scroll Lock**: Multi-signal scroll & content-change detector blocks swiping past the sent Reel.

            **APKs included:**
            1. **`SocialLite-OriginalAppBlocker.apk`** — Full Native App Reels/Shorts Blocker Edition.
            2. **`SocialLite-WebsiteClean.apk`** — Website / Chrome Direct Install Edition.
          files: |
            dist/SocialLite-WebsiteClean.apk
            dist/SocialLite-OriginalAppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
