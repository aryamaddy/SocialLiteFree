name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build WebsiteClean & OriginalAppBlocker Release APKs
        run: |
          ./gradlew assembleWebsiteCleanRelease assembleNativeBlockerRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/websiteClean/release/app-websiteClean-release.apk dist/SocialLite-WebsiteClean.apk
          cp app/build/outputs/apk/nativeBlocker/release/app-nativeBlocker-release.apk dist/SocialLite-OriginalAppBlocker.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocialLiteFree-apks
          path: dist/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SocialLiteFree v1.5.0 (Build ${{ github.run_number }})
          body: |
            ### 🚀 SocialLiteFree v1.5.0 (Build ${{ github.run_number }})

            **New in v1.5.0:**
            - **Reliable Repeat Blocking**: Blocks Reels & Shorts every single time (fixed single-trigger issue & hidden feed_tab bug with multi-window tracking + 250ms active watchdog).
            - **Allow Sent Reels (Block Scrolling)**: Open & watch a single Reel sent to you in Instagram DMs, and automatically exit if you try to scroll to a second Reel!
            - **YouTube Shorts Tab & Player Fix**: Improved Shorts tab lock overlay and modern YouTube Shorts player detection.
            - **Keep Active 24/7 (When SocialLite is Closed)**: Added unrestricted battery exemption prompt so Android doesn't pause the blocker when swiping SocialLite from Recents.

            **APKs included:**
            1. **`SocialLite-OriginalAppBlocker.apk`** — Full Native App Reels/Shorts Blocker Edition.
            2. **`SocialLite-WebsiteClean.apk`** — Website / Chrome Direct Install Edition.
          files: |
            dist/SocialLite-WebsiteClean.apk
            dist/SocialLite-OriginalAppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
