name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build WebsiteClean & OriginalAppBlocker Release APKs
        run: |
          ./gradlew assembleWebsiteCleanRelease assembleNativeBlockerRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/websiteClean/release/app-websiteClean-release.apk dist/SocialLite-WebsiteClean.apk
          cp app/build/outputs/apk/nativeBlocker/release/app-nativeBlocker-release.apk dist/SocialLite-OriginalAppBlocker.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocialLiteFree-apks
          path: dist/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SocialLiteFree v1.4.0 (Build ${{ github.run_number }})
          body: |
            ### 🚀 SocialLiteFree v1.4.0 (Build ${{ github.run_number }})

            **Choose the right APK for your needs:**
            1. **`SocialLite-WebsiteClean.apk`** — **Direct Website / Chrome Install Edition** (Zero Accessibility/Overlay permissions, installs cleanly on all phones without Play Protect fraud block; includes full ad-free YouTube, Background Play, Instagram feed filter, Sleep Mode & Screen Time).
            2. **`SocialLite-OriginalAppBlocker.apk`** — **Full Native Reels Blocker Edition** (Adds Android Accessibility Service to lock the Reels tab & exit Reels inside the official installed Instagram app; install via USB `adb install` or Google Play).

            **New in this release:**
            - Built-in **Automatic Update Checker & Background Notification** when newer builds ship!
          files: |
            dist/SocialLite-WebsiteClean.apk
            dist/SocialLite-OriginalAppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
